# Los cinco contenedores de la receta de serie (runbooks/deploy-vps-docker.md, paso 9).
# Vive en el VPS, en /srv/app/compose.prod.yml, y lo copia ahí `vps.py desplegar`.
# Reglas que este fichero cumple y que el método comprueba (visor/tests/test_vps.py):
#   - los cinco servicios se vigilan y se reinician solos si se caen;
#   - SOLO `caddy` publica puertos: nadie más asoma a internet;
#   - `app` no arranca hasta que la base de datos responde de verdad.
services:

  app:
    image: ${APP_IMAGEN}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Tu aplicación tiene que responder 200 en /health (requisito previo del runbook).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      autoheal: "true"

  caddy:
    image: caddy:2
    restart: unless-stopped
    # El ÚNICO servicio con puertos publicados. El cortafuegos del VPS solo deja entrar
    # aquí a los rangos de Cloudflare (servidor-preparar.sh).
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certificados:/etc/caddy/certificados:ro
      - datos-caddy:/data
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      autoheal: "true"

  bugsink:
    image: bugsink/bugsink:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER}
      BASE_URL: https://errores.${DOMINIO}
      BEHIND_HTTPS_PROXY: "True"
      PORT: "8000"
    volumes:
      # SQLite en volumen: uso pequeño. El salto a MySQL está en el paso 10 del runbook.
      - datos-bugsink:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      autoheal: "true"

  autoheal:
    # Docker reinicia por caída, NO por `unhealthy`: este contenedor es quien lo hace.
    image: willfarrell/autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f autoheal >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  datos-db: {}
  datos-caddy: {}
  datos-bugsink: {}
