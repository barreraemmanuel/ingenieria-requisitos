<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentaciones locales</title>
<style>
:root{--papel:#f4f5f1;--hoja:#fff;--tinta:#17212b;--suave:#53616b;--linea:#cad2cc;--acento:#235d78;--ok:#396b49;--aviso:#926612;--error:#a23429;font:16px/1.55 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--papel);color:var(--tinta)}main{max-width:960px;margin:auto;padding:32px 20px 80px}header{margin-bottom:24px}.marca{color:var(--aviso);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em}h1{margin:.2rem 0}.vista{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:24px;margin:18px 0}.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tarjeta,section{border:1px solid var(--linea);border-radius:8px;padding:14px}button{font:inherit;border:1px solid var(--acento);border-radius:7px;padding:9px 14px;background:var(--acento);color:white;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--aviso);outline-offset:3px}label{display:block;margin:12px 0}textarea{display:block;width:100%;min-height:90px;padding:8px}.estado{min-height:1.6em;color:var(--error)}a{color:var(--acento)}[hidden]{display:none!important}
@media (max-width: 700px){main{padding:20px 12px 60px}.vista{padding:16px}.rejilla{display:block}.tarjeta{margin:10px 0}button{width:100%}}
</style></head><body><main><header><div class="marca">ingeniería de requisitos</div><h1>Presentaciones locales</h1><p id="sub">Cargando contenido comprobable…</p></header>
<article id="vista-bandeja" class="vista" hidden><h2></h2><div class="contenido rejilla"></div></article>
<article id="vista-lector" class="vista" hidden><h2></h2><div class="contenido"></div></article>
<article id="vista-propuesta" class="vista" hidden><h2></h2><div class="contenido"></div></article>
<article id="vista-validacion" class="vista" hidden><h2></h2><div class="contenido"></div></article>
<form id="decision" hidden><fieldset><legend>Registrar decisión</legend><div id="opciones"></div><label>Comentario<textarea id="comentario" maxlength="2000"></textarea></label><button id="confirmar" type="submit">Confirmar decisión</button><p id="mensaje" class="estado" role="alert" aria-live="polite"></p></fieldset></form>
</main><script>
(function(){"use strict";var actual=null;function limpiar(){document.querySelectorAll(".vista").forEach(function(x){x.hidden=true;x.querySelector(".contenido").textContent=""});document.getElementById("decision").hidden=true}function texto(tag,valor){var n=document.createElement(tag);n.textContent=valor;return n}function lista(titulo,valores){var s=document.createElement("section");s.appendChild(texto("h3",titulo));var ul=document.createElement("ul");valores.forEach(function(v){ul.appendChild(texto("li",v))});s.appendChild(ul);return s}function pintar(p){limpiar();actual=p;var vista=document.getElementById("vista-"+p.tipo),c=vista.querySelector(".contenido");vista.hidden=false;vista.querySelector("h2").textContent=p.titulo+" · v"+p.version;if(p.tipo==="bandeja"){p.peticiones.forEach(function(x){var d=document.createElement("div");d.className="tarjeta";d.append(texto("h3",x.titulo),texto("p",x.detalle),texto("p","Estado: "+x.estado));var a=texto("a","Abrir detalle");a.href="/presentacion/"+encodeURIComponent(x.destino);d.appendChild(a);c.appendChild(d)})}else if(p.tipo==="lector"){[["Preguntas",p.preguntas],["Hechos",p.hechos],["Fuentes",p.fuentes],["Hallazgos",p.hallazgos],["Conclusiones",p.conclusiones],["Límites",p.limites]].forEach(function(x){c.appendChild(lista(x[0],x[1]))})}else{if(p.resumen)c.appendChild(texto("p",p.resumen));if(p.pasos)c.appendChild(lista("Pasos",p.pasos));if(p.evidencia)c.appendChild(lista("Evidencia resumida",p.evidencia));var f=document.getElementById("decision"),ops=document.getElementById("opciones");ops.textContent="";p.opciones.forEach(function(o){var l=document.createElement("label"),i=document.createElement("input");i.type="radio";i.name="eleccion";i.value=o;l.append(i,document.createTextNode(" "+o));ops.appendChild(l)});f.hidden=false}document.title=p.titulo+" · Presentaciones locales"}fetch("/manifiesto.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("No se pudo cargar el manifiesto");return r.json()}).then(function(m){var id=decodeURIComponent(location.pathname.replace(/^\/presentacion\//,""));var p=m.presentaciones.find(function(x){return x.id===id})||m.presentaciones.find(function(x){return x.tipo==="bandeja"})||m.presentaciones[0];document.getElementById("sub").textContent="Contenido local · sin caché";pintar(p)}).catch(function(e){document.getElementById("sub").textContent=e.message});document.getElementById("decision").addEventListener("submit",function(e){e.preventDefault();var elegida=document.querySelector('input[name="eleccion"]:checked'),msg=document.getElementById("mensaje");if(!elegida){msg.textContent="Elige una opción antes de confirmar.";return}var contenido=actual.tipo==="propuesta"?actual.resumen:actual.pasos.join("\n");fetch("/decisiones",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({presentacion:actual.id,version:actual.version,contenido_revisado:contenido,eleccion:elegida.value,comentario:document.getElementById("comentario").value,confirmado:true})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw Error(j.error);return j})}).then(function(){msg.style.color="var(--ok)";msg.textContent="Decisión registrada con recibo nuevo."}).catch(function(err){msg.style.color="var(--error)";msg.textContent=err.message})})})();
</script></body></html>
