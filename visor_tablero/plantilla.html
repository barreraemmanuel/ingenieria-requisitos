<style id="minimo-sin-base-css">
  /* R5 (unidad 076): el mínimo por si `/base.css` no llegara — fondo, tinta y
     familia literales, sin `var()`. La página quedaría sosa, pero NUNCA en
     blanco. Va ANTES del enlace para que base.css lo pise en cuanto cargue. */
  body { background: #0B0B0B; color: #EDEDED; font: 16px/1.5 "SF Mono", SFMono-Regular, ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
</style>
<link rel="stylesheet" href="/base.css">
<!-- apartado:estilos -->
<style>
  /* PLANTILLA FIJA del TABLERO DE CONTROL. Sólo lee. Hasta la 076 el bloque
     COMÚN (paleta, cabecera, barra de las cuatro webs, menú lateral, panel,
     plegables e interruptor de tema) estaba COPIADO aquí y un test lo comparaba
     línea a línea con las otras plantillas. Desde la 076 no hay copia: vive en
     `visor/base.css`, que este servidor sirve en `/base.css` y que enlazan las
     cuatro webs. Aquí abajo queda SÓLO lo propio del tablero. */
  /* ---------- lo propio del tablero ----------
     Tres secciones y una rejilla de tarjetas. Nada de esto existe en el visor
     de contratos: allí se lee UN documento, aquí se mira un workspace entero.
     Ni una regla de aquí pisa las del bloque común: sólo añade. */


  /* ---------- la tarjeta del taller (unidad 121) ----------
     Reutiliza `.tira` y `.dato` de `base.css`: aquí sólo se le da su rótulo y
     el aire que la separa de la cabecera. Ni un color a mano. */
  .taller { margin-top: var(--e-bloque); }
  .taller h2 { font-size: var(--t-nota); font-weight: bold; text-transform: none; color: var(--faint); margin: 0 0 var(--hueco-chico); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .taller .tira { margin-top: var(--hueco-chico); }
  .taller .detalle a { color: var(--accent); }
  .explica-corta { color: var(--faint); font-size: var(--t-nota); line-height: var(--lh-lectura); margin: 4px 0 var(--hueco-chico); }

  /* R2 del bug 067: el enlace no se apaga ni desaparece — al lado se DICE que
     esa web no está levantada. Un enlace muerto miente; esto no. */
  .apagada { margin-left: 8px; font-size: var(--t-nota); font-weight: bold; color: var(--warn); white-space: nowrap; }

  /* ---------- avatares ----------
     SVG en línea, sin un solo recurso externo: tres siluetas, una por rol, que
     RESPIRAN mientras el agente vive y se quedan quietas en cuanto termina. Es
     la señal de un vistazo que pidió el usuario, y es honesta: sólo se anima
     `.avatar.vivo`, que sólo lo pone un recibo abierto con el PID vivo. */
  .avatar { flex: 0 0 44px; width: 44px; height: 44px; border-radius: var(--radio); border: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: center; }
  .avatar svg { width: 30px; height: 30px; }
  .avatar .cara { fill: var(--line-soft); stroke: var(--muted); stroke-width: 1.4; }
  .avatar .ojo { fill: var(--muted); }
  .avatar .util { fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
  .avatar[data-avatar="constructor"] .util { stroke: var(--accent); }
  .avatar[data-avatar="revisor"] .util { stroke: var(--alt); }
  .avatar[data-avatar="padre"] .util { stroke: var(--warn); }
  .avatar.vivo { border-color: var(--ok); animation: latido 2.4s ease-in-out infinite; }
  .avatar.vivo .util { animation: trabajar 1.1s ease-in-out infinite; transform-origin: 12px 12px; }
  .avatar.vivo .ojo { animation: parpadeo 4.2s steps(1, end) infinite; }
  @keyframes latido { 0%, 100% { box-shadow: 0 0 0 0 var(--ok-bg); } 50% { box-shadow: 0 0 0 5px var(--ok-bg); } }
  @keyframes trabajar { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes parpadeo { 0%, 92%, 100% { opacity: 1; } 95% { opacity: .1; } }
  @media (prefers-reduced-motion: reduce) {
    .avatar.vivo, .avatar.vivo .util, .avatar.vivo .ojo { animation: none; }
  }
</style>
<!-- /apartado:estilos -->
</head>
<body>
<script>
  /* Tema: por defecto manda el sistema (prefers-color-scheme). Si el usuario toca el botón,
     su elección manda y se recuerda. Se aplica ANTES de pintar para no dar un fogonazo.
     Bloque literal del visor de flujos (misma clave de memoria: el ajuste viaja entre las
     dos webs); un test lo compara línea a línea. */
  (function () {
    var GUARDADO = "visor-tema";
    var raiz = document.documentElement;
    var elegido = null;
    try { elegido = localStorage.getItem(GUARDADO); } catch (e) { elegido = null; }
    if (elegido === "dark" || elegido === "light") raiz.dataset.theme = elegido;

    function oscuroAhora() {
      if (raiz.dataset.theme) return raiz.dataset.theme === "dark";
      return window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function pintarBoton(boton) {
      var oscuro = oscuroAhora();
      boton.textContent = oscuro ? "☀" : "☾";
      boton.title = oscuro ? "Cambiar a claro" : "Cambiar a oscuro";
    }
    document.addEventListener("DOMContentLoaded", function () {
      var boton = document.getElementById("boton-tema");
      if (!boton) return;
      pintarBoton(boton);
      boton.addEventListener("click", function () {
        var nuevo = oscuroAhora() ? "light" : "dark";
        raiz.dataset.theme = nuevo;
        try { localStorage.setItem(GUARDADO, nuevo); } catch (e) { /* sin memoria, da igual */ }
        pintarBoton(boton);
      });
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (!raiz.dataset.theme) pintarBoton(boton);
      });
    });
  })();
</script>

<!-- apartado:guion -->
<script>
(function () {
  "use strict";

  /* Unidad 081: los datos de este apartado cuelgan de su prefijo porque los
     cuatro visores comparten un solo servidor. `RUTA` es el único sitio que lo
     sabe; servida suelta (sin cáscara) devuelve la ruta de siempre. */
  function RUTA(sufijo) {
    return ((window.IR && window.IR.base) || "") + sufijo;
  }

  /* El tablero SÓLO mira: no hay un fetch con método distinto de GET en toda la
     página, y el servidor responde 405 a cualquier POST. Aprobar, decidir y
     cerrar se hacen en las otras tres webs, que son las que escriben.

     Y desde el bug 067 tampoco las COPIA: aquí quedan tres secciones —qué está
     pasando ahora y qué te toca a ti— y cada línea lleva a la web donde eso se
     hace de verdad. Leer contratos ya cerrados, entregas y documentación vive
     en el visor de contratos y en presentaciones; `/estado.json` sigue
     trayendo `historial` y `documentacion` (estado.py no se toca), pero esta
     página ya no los pinta. */

  var SONDEO = 5000;                 // la cabecera se refresca sola cada 5 s
  var SECCIONES = ["ahora", "te-toca", "por-hacer"];

  /* R2 (bug 067), reescrito por la 081: los otros tres apartados son RUTAS de
     esta misma web, no otros puertos. Ya no hay «web apagada» que avisar: si
     estás leyendo el tablero, los otros tres apartados están en pie. */
  var WEBS = {
    contratos: "/contratos",
    presentaciones: "/presentaciones",
    flujos: "/flujos"
  };

  var panel = document.getElementById("panel");
  var cabecera = document.getElementById("cabecera");
  var taller = document.getElementById("taller");
  var banner = document.getElementById("banner");
  var sub = document.getElementById("sub");
  var foto = null;
  var actual = "ahora";

  /* esc/enLinea/bloques (el motor de bloques markdown) viven en render.js,
     compartido con el visor de contratos y el de presentaciones: lo carga un
     <script src="/render.js"> antes de este bloque. Aquí no hay copia. */

  function fecha(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return esc(iso);
    return d.toLocaleString("es-ES", {day: "2-digit", month: "2-digit",
                                      hour: "2-digit", minute: "2-digit"});
  }

  function dias(n) {
    if (n === null || n === undefined) return "";
    if (n === 0) return "hoy";
    return "hace " + n + (n === 1 ? " día" : " días");
  }

  function duracion(minutos) {
    if (minutos === null || minutos === undefined) return "sin hora de arranque";
    if (minutos < 60) return minutos + " min";
    return Math.floor(minutos / 60) + " h " + (minutos % 60) + " min";
  }

  /* Los avatares: tres siluetas distintas, cada una con su herramienta. El SVG
     va aquí dentro a propósito (nada externo, ni una petición más). */
  function avatar(rol, vivo) {
    // Un solo icono de línea por rol, centrado (iteración 27-08: la cara con ojos
    // quedaba DEBAJO del útil y la lupa del revisor parecía dos iconos montados).
    var util = {
      constructor: '<path class="util" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
      revisor: '<circle class="util" cx="10.5" cy="10.5" r="5.5"/><path class="util" d="M14.5 14.5 L20 20"/>',
      padre: '<path class="util" d="M5 10 L12 4 L19 10 M6 9 V19 H18 V9 M10 19 V13 H14 V19"/>'
    }[rol] || '<path class="util" d="M6 12 H18"/>';
    return '<div class="avatar' + (vivo ? " vivo" : "") + '" data-avatar="' +
      esc(rol) + '" title="' + esc(rol) + '" aria-label="' + esc(rol) + '">' +
      '<svg viewBox="0 0 24 24" role="img" aria-hidden="true">' + util + "</svg></div>";
  }

  /* G-2302: una fuente que no se pudo leer se DICE. Un cero silencioso donde no
     se pudo mirar es la única mentira que este tablero no se puede permitir,
     porque es la que parece un tablero en verde. */
  function fuenteRota(bloque) {
    if (!bloque || bloque.estado === "ok") return "";
    var motivo = bloque.detalle || (bloque.estado === "ausente"
      ? "la fuente no existe" : "no se pudo comprobar");
    return '<div class="aviso-fuente">No se pudo leer esta fuente: ' +
      esc(motivo) + " — no es que no haya nada.</div>";
  }

  function dato(etiqueta, valor, roto) {
    return '<div class="dato' + (roto ? " roto" : "") + '"><div class="etiqueta">' +
      esc(etiqueta) + '</div><div class="valor">' + valor + "</div></div>";
  }

  /* ---------- R2: cada cosa, a la web donde se hace ----------
     `cabecera.servidores` ya dice qué webs están levantadas y en qué puerto.
     Con eso: el enlace apunta al puerto REAL si la web está viva, y si no lo
     está se avisa al lado. Si NO se pudieron mirar los puertos (`estado` que
     no es "ok"), no se declara nada apagado: no saber no es saber que no. */

  function enlaceA(f, cual, ruta, texto) {
    return '<a href="' + esc(WEBS[cual] + ruta) + '" data-web="' + esc(cual) +
      '">' + esc(texto) + "</a>";
  }

  function aContrato(f, unidad, texto) {
    /* 081: el apartado de contratos abre el contrato por su ancla, en vez de
       descargar el markdown crudo que servía la web suelta. */
    return enlaceA(f, "contratos", "#" + encodeURIComponent(unidad),
                   texto || unidad);
  }

  function lista(items, pintarUno, vacio) {
    if (!items.length) return '<div class="vacio-corto">' + vacio + "</div>";
    return '<ul class="lista-plana">' + items.map(function (fila) {
      return "<li><span>" + pintarUno(fila) + '</span><span class="espera">' +
        esc(dias(fila.dias)) + "</span></li>";
    }).join("") + "</ul>";
  }

  /* ---------- cabecera ---------- */

  function pintarCabecera(c) {
    var html = "";
    var v = c.version;
    html += v.estado === "ok"
      ? dato("Método", esc(v.local) + " <small>local · publicada " +
             esc(v.publicada) + (v.al_dia ? "" : " ⚠") + "</small>")
      : dato("Método", esc(v.detalle || "no se pudo leer la versión"), true);
    ["main", "meta"].forEach(function (cual) {
      var e = c.sin_empujar[cual];
      var titulo = cual === "main" ? "Sin empujar · main" : "Sin empujar · meta-repo";
      html += e.estado === "ok"
        ? dato(titulo, e.commits + (e.commits === 1 ? " commit" : " commits"))
        : dato(titulo, esc(e.detalle || "no se pudo comprobar"), true);
    });
    var k = c.canario;
    html += k.estado === "ok"
      ? dato("Canario", esc(k.veredicto) + (k.porcentaje === null ? "" :
             " <small>" + k.porcentaje.toFixed(0) + " % de " + esc(String(k.modelo)) +
             "</small>"))
      : dato("Canario", esc(k.detalle || "no se pudo comprobar"), true);
    var s = c.servidores;
    if (s.estado !== "ok") {
      html += dato("Servidores", esc(s.detalle || "no se pudo comprobar"), true);
    } else if (!s.lista.length) {
      html += dato("Servidores", "<small>ninguno levantado</small>");
    } else {
      // Cifra grande (cuántos) y el detalle en pequeño, una línea por servidor:
      // misma anatomía que las otras cuatro cifras de la tira.
      html += dato("Servidores", String(s.lista.length) + '<div class="detalle">' +
        s.lista.map(function (x) {
          return esc(x.servicio.replace(/^visor de /, "")) + " :" + x.puerto +
            (x.arbol ? " · " + esc(x.arbol) : "");
        }).join("<br>") + "</div>");
    }
    cabecera.innerHTML = html;
  }

  /* ---------- R1-R3 de la 121: el taller ----------
     Lo que hay que saber de la MÁQUINA para no preguntarlo: en qué dos repos
     estás y cómo los tienes, qué hay levantado, y si la sesión que dirige el
     trabajo está viva. Todo sale de `taller` en /estado.json, leído del disco
     en el momento; aquí sólo se pinta. Regla G-2302: lo que no se pudo leer se
     DICE («sin datos»), nunca se pinta como un cero tranquilizador. */

  function sinDatos(bloque, porDefecto) {
    return esc((bloque && bloque.detalle) || porDefecto || "sin datos");
  }

  function pintarRepo(r) {
    var etiqueta = r.clave === "meta-repo" ? "Meta-repo" : "Repo de código";
    if (r.estado !== "ok") {
      return dato(etiqueta, sinDatos(r, "no hay repo aquí"), true);
    }
    var titulo = esc(r.nombre || r.carpeta);
    if (r.github) {
      titulo = '<a href="' + esc(r.github) + '" target="_blank" rel="noopener">' +
        titulo + "</a>";
    }
    var lineas = ["rama " + esc(r.rama || "sin rama")];
    var c = r.sin_commitear;
    lineas.push(c.estado === "ok"
      ? (c.cambios === 0 ? "limpio"
         : c.cambios + (c.cambios === 1 ? " cambio sin commitear"
                                        : " cambios sin commitear"))
      : "cambios: " + sinDatos(c));
    var e = r.sin_empujar;
    lineas.push(e.estado === "ok"
      ? e.commits + (e.commits === 1 ? " commit sin empujar"
                                     : " commits sin empujar")
      : "sin empujar: " + sinDatos(e));
    if (!r.github) lineas.push("sin remoto de GitHub");
    return dato(etiqueta, titulo + '<div class="detalle">' +
                lineas.join("<br>") + "</div>");
  }

  function pintarServidoresDelTaller(s) {
    if (!s || s.estado !== "ok") return dato("Servidores", sinDatos(s), true);
    if (!s.lista.length) {
      return dato("Servidores", "0" + '<div class="detalle">' +
                  "nada del método escuchando ahora mismo</div>");
    }
    return dato("Servidores", String(s.lista.length) + '<div class="detalle">' +
      s.lista.map(function (x) {
        return ":" + x.puerto + " · " + esc(x.servicio) +
          (x.arbol ? " · " + esc(x.arbol) : "") +
          (x.desde ? " · desde " + esc(fecha(x.desde)) : "");
      }).join("<br>") + "</div>");
  }

  function pintarDocker(d) {
    if (!d || d.estado !== "ok") return dato("Docker", sinDatos(d), true);
    if (!d.lista.length) {
      return dato("Docker", "0" + '<div class="detalle">ningún contenedor en marcha</div>');
    }
    return dato("Docker", String(d.lista.length) + '<div class="detalle">' +
      d.lista.map(function (c) {
        return esc(c.nombre) + " · " + esc(c.imagen);
      }).join("<br>") + "</div>");
  }

  function pintarSesion(s) {
    if (!s || s.estado !== "ok") return dato("Sesión principal", sinDatos(s), true);
    if (s.activa) {
      return dato("Sesión principal", "trabajando ahora" +
                  '<div class="detalle">desde hace ' + esc(duracion(s.minutos)) +
                  "</div>");
    }
    return dato("Sesión principal", "parada" + '<div class="detalle">desde ' +
                esc(fecha(s.desde)) + "</div>");
  }

  function pintarTaller(f) {
    var d = (f && f.taller) || f;
    if (!d || !d.repos) return "";
    return "<h2>Taller</h2>" +
      '<div class="explica-corta">Dónde estás trabajando y qué tienes en marcha ' +
      "en esta máquina, leído en el momento.</div>" +
      '<div class="tira">' +
      d.repos.map(pintarRepo).join("") +
      pintarServidoresDelTaller(d.servidores) +
      pintarDocker(d.docker) +
      pintarSesion(d.sesion) +
      "</div>";
  }

  /* ---------- las tres secciones ---------- */

  function tarjetaQuieta(a) {
    return '<div class="tarjeta quieta"><div class="con-avatar">' +
      avatar(a.avatar, false) + "<div><h3>" + esc(a.unidad) + "</h3>" +
      '<div class="linea">' + esc(a.rol) + " · " +
      esc(a.resultado || "sin resultado en el recibo") + "</div>" +
      '<div class="linea">' + esc(duracion(a.minutos)) + "</div>" +
      "</div></div></div>";
  }

  function pintarAhora(f) {
    var d = f.ahora;
    var html = '<h2 class="seccion">Ahora</h2>' +
      '<div class="seccion-nota">Quién trabaja ahora mismo · ' + esc(fecha(d.leido)) + "</div>" + fuenteRota(d);
    if (!d.vivos.length) {
      html += '<div class="vacio-corto">Ahora mismo no trabaja ningún agente.</div>';
    } else {
      html += '<div class="tarjetas">' + d.vivos.map(function (a) {
        var rutas = a.ficheros && a.ficheros.length
          ? "Toca: " + a.ficheros.map(esc).join(", ")
          : (a.ficheros_estado === "ok"
             ? "Todavía no ha tocado nada en su worktree"
             : "No pude mirar su worktree");
        return '<div class="tarjeta viva"><div class="con-avatar">' +
          avatar(a.avatar, true) + "<div><h3>" + esc(a.unidad) + "</h3>" +
          '<div class="linea">' + esc(a.rol) + " · " + esc(a.modelo) + "</div>" +
          '<div class="linea">' + esc(duracion(a.minutos)) + " trabajando</div>" +
          '<div class="linea">Último paso: ' +
          esc(a.checkpoint ? a.checkpoint.nombre + " · " + a.checkpoint.detalle
                           : "sin checkpoints") + "</div>" +
          '<div class="rutas">' + rutas + "</div>" +
          "</div></div></div>";
      }).join("") + "</div>";
    }
    /* R5: en «Ahora» sólo hay vida. Los que ya terminaron hoy siguen contados,
       pero plegados: se abren si te interesan, no gritan si no. */
    html += '<details class="plegable" data-plegable="terminados-hoy"><summary>Han terminado hoy · ' +
      d.terminados_hoy.length + "</summary>";
    html += d.terminados_hoy.length
      ? '<div class="tarjetas">' + d.terminados_hoy.map(tarjetaQuieta).join("") + "</div>"
      : '<div class="vacio-corto">Hoy no ha terminado ningún agente.</div>';
    return html + "</details>";
  }

  panel.addEventListener("click", function (ev) {
    var boton = ev.target.closest("button[data-aprobar]");
    if (!boton) return;
    var unidad = boton.getAttribute("data-aprobar");
    var resultado = boton.parentNode.querySelector(".resultado");
    if (!boton.classList.contains("confirmar")) {
      boton.classList.add("confirmar", "boton-primario");
      boton.textContent = "Confirmar";
      setTimeout(function () { if (!boton.disabled) { boton.classList.remove("confirmar", "boton-primario"); boton.textContent = "Aprobar"; } }, 6000);
      return;
    }
    boton.disabled = true;
    fetch(WEBS.contratos + "/aprobar/" + encodeURIComponent(unidad), {method: "POST"})
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || r.status); return d; }); })
      .then(function (d) { resultado.textContent = "Aprobado el " + d.aprobado + "."; boton.textContent = "Aprobado"; })
      .catch(function (e) { boton.disabled = false; resultado.textContent = "No se pudo aprobar: " + e.message; });
  });

  function pintarTeToca(f) {
    var d = f.te_toca;
    return '<h2 class="seccion">Te toca a ti</h2>' +
      '<div class="seccion-nota">Parado hasta que decidas · ' + esc(fecha(d.leido)) + "</div>" + fuenteRota(d) +
      '<div class="subtitulo">Contratos por aprobar · ' + d.contratos.length + '</div>' +
      (d.contratos.length
        ? '<div class="tarjetas">' + d.contratos.map(function (c) {
            return '<div class="tarjeta" data-unidad="' + esc(c.unidad) + '"><h3>' +
              aContrato(f, c.unidad, c.unidad) + "</h3>" +
              '<div class="linea">Espera tu OK desde ' + esc(dias(c.dias)) + "</div>" +
              '<div class="acciones"><button type="button" class="boton boton-ok" data-aprobar="' +
              esc(c.unidad) + '">Aprobar</button>' +
              '<a class="boton" href="' + esc(WEBS.contratos + "#" + encodeURIComponent(c.unidad)) + '" data-web="contratos">Leer el contrato</a>' +
              '<div class="resultado" aria-live="polite"></div></div></div>';
          }).join("") + "</div>"
        : '<div class="vacio-corto">Ningún contrato espera tu OK.</div>') +
      '<div class="subtitulo">Te toca validar · ' + d.en_validacion.length + '</div>' +
      /* 121: NO se llaman «terminadas». Están fusionadas y revisadas, pero la
         unidad no se archiva hasta que la persona la prueba y lo confirma. */
      '<div class="explica-corta">Cada una está fusionada y revisada; se archiva cuando la pruebes y confirmes.</div>' +
      lista(d.en_validacion, function (v) {
        return enlaceA(f, "presentaciones", "/" + encodeURIComponent(v.unidad), v.unidad);
      }, "Nada pendiente de validar.") +
      '<div class="subtitulo">Peticiones sin encaminar · ' + d.peticiones.length + '</div>' +
      '<div class="seccion-nota">Se deciden hablando con el agente.</div>' +
      lista(d.peticiones, function (p) { return esc(p.resumen || ""); },
            "Ninguna petición capturada sin evaluar.");
  }

  function pintarPorHacer(f) {
    var d = f.por_hacer;
    var html = '<h2 class="seccion">Por hacer</h2>' +
      '<div class="seccion-nota">Aprobado y en cola · ' + esc(fecha(d.leido)) + "</div>" + fuenteRota(d);
    html += d.unidades.length
      ? '<div class="tarjetas">' + d.unidades.map(function (u) {
          var plan = u.plan
            ? '<div class="barra"><span style="width:' +
              Math.round(100 * u.plan.hechos / u.plan.total) + '%"></span></div>' +
              '<div class="linea">Plan: ' + u.plan.hechos + " de " + u.plan.total +
              "</div>"
            : "";
          var bloqueo = u.bloqueo
            ? '<div class="linea">⚠ No arranca: comparte ' +
              u.bloqueo.ficheros.map(esc).join(", ") + " con " +
              u.bloqueo.con.map(esc).join(", ") + "</div>"
            : "";
          var flujo = u.actividad
            ? '<div class="linea">Flujo: ' +
              enlaceA(f, "flujos", "#" + encodeURIComponent(u.actividad), u.actividad) + "</div>"
            : "";
          return '<div class="tarjeta' + (u.bloqueo ? " bloqueada" : "") +
            '"><h3>' + aContrato(f, u.carpeta, u.unidad) + "</h3>" +
            '<div class="linea">' + esc(u.fase) + " · " + esc(u.tipo) +
            (u.pendiente_de_aprobar
              ? ' <span class="chip chip-pendiente">sin aprobar</span>'
              : ' <span class="chip chip-aprobado">aprobado</span>') + "</div>" +
            plan + bloqueo + flujo + "</div>";
        }).join("") + "</div>"
      : '<div class="vacio-corto">No queda ninguna unidad abierta.</div>';
    var estados = Object.keys(d.peticiones || {}).sort();
    html += '<div class="dia">Peticiones</div>';
    html += estados.length
      ? estados.map(function (e) {
          return '<div class="linea"><strong>' + esc(e) + "</strong> · " +
            d.peticiones[e].length + "</div>" +
            lista(d.peticiones[e], function (p) { return esc(p.resumen || ""); }, "");
        }).join("")
      : '<div class="vacio-corto">Ninguna petición abierta.</div>';
    return html;
  }

  /* ---------- menú, rutas por hash y sondeo ---------- */

  function pintarRecuentos(f) {
    var cuentas = {
      "ahora": f.ahora.vivos.length,
      "te-toca": f.te_toca.contratos.length + f.te_toca.en_validacion.length +
                 f.te_toca.peticiones.length,
      "por-hacer": f.por_hacer.unidades.length
    };
    document.querySelectorAll("#secciones .recuento").forEach(function (marca) {
      var cuenta = cuentas[marca.dataset.recuento];
      marca.textContent = cuenta === undefined ? "·" : String(cuenta);
    });
  }

  /* Bug 083: el sondeo repinta el panel entero y cada <details> renacía
     cerrado, deshaciendo lo que el usuario acababa de abrir. Antes de repintar
     se apunta qué plegables (por su data-plegable) están abiertos y después se
     restauran. El mapa vive fuera del panel: sobrevive al sondeo y al cambio de
     pestaña. Al cargar la página nace vacío, así que el plegable sigue
     arrancando cerrado (R5 de la 067). */
  var plegablesAbiertos = {};

  function pintarEn(elemento, html) {
    elemento.querySelectorAll("details[data-plegable]").forEach(function (d) {
      plegablesAbiertos[d.dataset.plegable] = !!d.open;
    });
    elemento.innerHTML = html;
    elemento.querySelectorAll("details[data-plegable]").forEach(function (d) {
      if (plegablesAbiertos[d.dataset.plegable]) d.open = true;
    });
  }

  function pintar() {
    if (!foto) return;
    document.querySelectorAll("#secciones a").forEach(function (a) {
      var suya = a.dataset.seccion === actual;
      a.classList.toggle("activa", suya);
      if (suya) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    if (actual === "ahora") pintarEn(panel, pintarAhora(foto));
    else if (actual === "te-toca") pintarEn(panel, pintarTeToca(foto));
    else pintarEn(panel, pintarPorHacer(foto));
  }

  /* Rutas por hash, como el visor de flujos y el de presentaciones: el menú son
     enlaces `#seccion` de verdad, así que el botón atrás del navegador
     devuelve a la sección anterior sin recargar nada. */
  function irAlHash() {
    var seccion = (location.hash || "#ahora").slice(1);
    if (SECCIONES.indexOf(seccion) === -1) seccion = "ahora";
    actual = seccion;
    pintar();
  }

  function sondear() {
    fetch(RUTA("/estado.json"), {cache: "no-store"}).then(function (r) {
      return r.json();
    }).then(function (datos) {
      if (datos.error) throw new Error(datos.error);
      banner.classList.remove("visible");
      foto = datos;
      sub.textContent = "Leído " + fecha(datos.generado) + " · " +
        foto.ahora.vivos.length + " agente(s) trabajando ahora";
      pintarCabecera(datos.cabecera);
      taller.innerHTML = pintarTaller(datos);
      pintarRecuentos(datos);
      pintar();
    }).catch(function () {
      banner.classList.add("visible");
    });
  }

  window.addEventListener("hashchange", irAlHash);
  document.addEventListener("DOMContentLoaded", function () {
    irAlHash();
    sondear();
    setInterval(sondear, SONDEO);
  });

  /* Banco de pruebas (bug 067): la suite llama a estas tres con una foto de
     `/estado.json` y comprueba los enlaces sin abrir un navegador. La página no
     las usa por aquí — pinta llamándolas directamente en `pintar()`. */
  window.tablero = {pintarAhora: pintarAhora, pintarTeToca: pintarTeToca, pintarEn: pintarEn,
                    pintarPorHacer: pintarPorHacer, pintarTaller: pintarTaller};
})();
</script>
<!-- /apartado:guion -->
</body>
</html>
