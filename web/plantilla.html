<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title><!--{TITULO}--> · ingeniería de requisitos</title>
<style id="minimo-sin-base-css">
  /* R5 (unidad 076): el mínimo por si `/base.css` no llegara — fondo, tinta y
     familia literales, sin `var()`. La página quedaría sosa, pero NUNCA en
     blanco. Va ANTES del enlace para que base.css lo pise en cuanto cargue.
     Unidad 082: son los MISMOS valores que los tokens por defecto (`--paper`,
     `--ink` y la pila mono), copiados a mano porque aquí no puede haber
     `var()`. Un test los compara: si el token cambia y esto no, hay fogonazo.
     Ya no hay variante clara: la web es oscura por defecto. */
  body { background: #0B0B0B; color: #EDEDED; font: 16px/1.5 "SF Mono", SFMono-Regular, ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
</style>
<link rel="stylesheet" href="/base.css">
<!-- LA CÁSCARA de la web del método (unidad 081). Una sola web, un solo puerto y
     cuatro apartados: el tablero (la portada), los contratos, las presentaciones
     y los flujos. Aquí vive lo COMÚN — la barra de los cuatro apartados, la marca
     y el interruptor de tema — y `web/servir.py` encaja debajo la sección del
     apartado que toca, recortada por marcadores de su propia plantilla. Los
     estilos siguen viviendo enteros en `visor/base.css`, que se sirve en
     `/base.css`: aquí no se copia ni una regla. -->
<!--{ESTILOS}-->
</head>
<body>
<!-- LA BARRA COMÚN, en su único sitio (R2). Son rutas relativas del mismo
     origen: navegar entre apartados ya no cambia de puerto ni de pestaña.
     `web/servir.py` la saca de aquí y le marca el apartado que está sirviendo. -->
<template id="barra-comun">
      <nav class="barra-webs" aria-label="Los cuatro apartados de la web">
        <a href="/" data-web="tablero">Inicio</a>
        <a href="/contratos" data-web="contratos">Contratos</a>
        <a href="/presentaciones" data-web="presentaciones">Entregas</a>
        <a href="/flujos" data-web="flujos">Flujos</a>
      </nav>
</template>
<!--{CONTEXTO}-->
<script>
  /* Tema: por defecto manda el sistema (prefers-color-scheme). Si el usuario toca el botón,
     su elección manda y se recuerda. Se aplica ANTES de pintar para no dar un fogonazo.
     Bloque literal del visor de flujos (misma clave de memoria: el ajuste viaja entre las
     dos webs); un test lo compara línea a línea. */
  (function () {
    var GUARDADO = "visor-tema";
    var raiz = document.documentElement;
    var elegido = null;
    try { elegido = localStorage.getItem(GUARDADO); } catch (e) { elegido = null; }
    if (elegido === "dark" || elegido === "light") raiz.dataset.theme = elegido;

    /* Unidad 082: OSCURO POR DEFECTO. Antes mandaba el sistema; ahora el punto
       de partida es el oscuro de la referencia y el sistema no lo cambia — el
       claro existe, pero sólo si el usuario lo pide con el botón. */
    function oscuroAhora() {
      if (raiz.dataset.theme) return raiz.dataset.theme === "dark";
      return true;
    }
    function pintarBoton(boton) {
      var oscuro = oscuroAhora();
      boton.textContent = oscuro ? "☀" : "☾";
      boton.title = oscuro ? "Cambiar a claro" : "Cambiar a oscuro";
    }
    document.addEventListener("DOMContentLoaded", function () {
      var boton = document.getElementById("boton-tema");
      if (!boton) return;
      pintarBoton(boton);
      boton.addEventListener("click", function () {
        var nuevo = oscuroAhora() ? "light" : "dark";
        raiz.dataset.theme = nuevo;
        try { localStorage.setItem(GUARDADO, nuevo); } catch (e) { /* sin memoria, da igual */ }
        pintarBoton(boton);
      });
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (!raiz.dataset.theme) pintarBoton(boton);
      });
    });
  })();
</script>
<script>
  /* R2 (unidad 081): la navegación de la web única.

     Los cuatro apartados son RUTAS REALES del mismo origen (`/`, `/contratos`,
     `/presentaciones`, `/flujos`), no cuatro puertos: la barra son enlaces de
     verdad y la flecha atrás del navegador recorre el historial de apartados
     sola, sin que este guion tenga que interceptar nada.

     Dentro de un apartado el estado vive en el hash (qué contrato, qué flujo,
     qué sección) y `pushState`/el hash lo van dejando en el historial. Cuando la
     flecha atrás vuelve a una de esas entradas el navegador NO recarga: manda un
     `popstate`, y es aquí donde se le dice al apartado que se repinte con el
     estado al que se ha vuelto. Sin esto, atrás dentro de un apartado no haría
     nada visible. */
  (function () {
    var IR = window.IR || (window.IR = {});

    /* La ruta de un dato de ESTE apartado: `/contratos` + `/unidades.json`. Las
       secciones la usan en vez de escribir la ruta absoluta, que es lo que las
       ataba a su antiguo puerto. */
    IR.ruta = function (sufijo) { return (IR.base || "") + sufijo; };

    IR.apartadoDe = function (camino) {
      var primero = (camino || "/").replace(/^\/+/, "").split("/")[0];
      if (!primero) return "tablero";
      if (primero === "contratos" || primero === "presentaciones" ||
          primero === "flujos" || primero === "tablero") return primero;
      return null;
    };

    /* Un apartado registra aquí cómo se repinta al volver atrás. */
    IR.alVolver = null;

    window.addEventListener("popstate", function () {
      if (IR.apartadoDe(location.pathname) !== IR.apartado) {
        /* Se volvió a OTRO apartado por una entrada que no era una carga real
           (sólo puede pasar si alguien hizo pushState cruzado): se carga. */
        location.reload();
        return;
      }
      if (typeof IR.alVolver === "function") {
        IR.alVolver(decodeURIComponent((location.hash || "").replace(/^#/, "")));
      }
    });
  })();
</script>
<script>
  /* Unidad 107 · APROBAR DESDE LA WEB, los dos gestos que faltaban.

     La 091 dejó el botón Aprobar en Contratos (lo pinta la sección de contratos,
     que es suya). Los otros dos —aprobar los planos de flujos y dar el OK final de
     una validación guiada— no viven en ninguna sección: son de la CÁSCARA, porque
     es la única pieza que sabe en qué apartado estamos y si la web se lanzó en
     solo lectura. Aquí se pintan y aquí se disparan.

     Las tres reglas del gesto, iguales para los tres botones:
       1. Se pide la HUELLA de lo que la página tiene delante y se manda con el POST.
          Si el fichero cambió, el servidor contesta «relee» y no escribe nada.
       2. La confirmación es EN LÍNEA (el botón cambia a «¿seguro?»): un `confirm()`
          del navegador bloquea la página y no hay forma de probarlo.
       3. Con `--solo-lectura` no se pinta ninguno, y además se retiran los que
          traiga la sección: la web sin manos no tiene manos en ningún apartado. */
  (function () {
    var IR = window.IR || (window.IR = {});
    var SOLO_LECTURA = !!IR.solo_lectura;

    function quitarLosBotonesDeEscribir() {
      var selector = "[data-accion], [data-aprobar], .acciones-aprobar";
      Array.prototype.forEach.call(document.querySelectorAll(selector), function (nodo) {
        nodo.remove();
      });
    }

    function json(ruta, opciones) {
      return fetch(ruta, opciones || {}).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (datos) {
          return { ok: r.ok, codigo: r.status, datos: datos };
        });
      });
    }

    function post(ruta, cuerpo) {
      return json(ruta, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cuerpo),
      });
    }

    /* La huella de lo que se está mirando: `/api/huella?tipo=...&ref=...`. */
    function huella(tipo, ref) {
      var ruta = "/api/huella?tipo=" + encodeURIComponent(tipo) +
                 (ref ? "&ref=" + encodeURIComponent(ref) : "");
      return json(ruta).then(function (r) {
        return r.ok ? r.datos.huella : null;
      });
    }
    IR.huella = huella;

    function barra(rotulo, alPulsar) {
      var caja = document.createElement("div");
      caja.className = "acciones-aprobar";
      caja.setAttribute("data-aprobar", "");
      caja.style.cssText = "position:fixed; right:24px; bottom:24px; z-index:20;" +
        "display:flex; gap:12px; align-items:center;";
      var aviso = document.createElement("span");
      aviso.className = "dato";
      var boton = document.createElement("button");
      boton.type = "button";
      boton.className = "boton";
      boton.textContent = rotulo;
      var armado = false;
      boton.addEventListener("click", function () {
        if (!armado) {                       /* confirmación EN LÍNEA, no `confirm()` */
          armado = true;
          boton.textContent = "¿seguro? pulsa otra vez";
          return;
        }
        boton.disabled = true;
        boton.textContent = "…";
        alPulsar(function (mensaje, bien) {
          aviso.textContent = mensaje;
          if (bien) {
            boton.remove();
          } else {
            armado = false;
            boton.disabled = false;
            boton.textContent = rotulo;
          }
        });
      });
      caja.appendChild(aviso);
      caja.appendChild(boton);
      document.body.appendChild(caja);
      return caja;
    }

    function aprobarPlanos(terminado) {
      huella("planos", null).then(function (h) {
        return post("/api/aprobar-planos", h ? { huella: h } : {});
      }).then(function (r) {
        if (r.ok) return terminado("planos aprobados · por ti (web)", true);
        terminado(r.datos.error || "no pude aprobar los planos", false);
      });
    }

    function unidadDeLaValidacion() {
      var trozos = (IR.base || "").split("/").filter(Boolean);
      return trozos.length > 1 ? trozos[1] : null;
    }

    function darElOk(terminado) {
      var unidad = unidadDeLaValidacion();
      if (!unidad) return terminado("no hay ninguna validación guiada abierta", false);
      json(IR.ruta("/manifiesto.json")).then(function (r) {
        var p = (r.datos.presentaciones || [])[0];
        if (!p) return terminado("esta validación no tiene pasos que confirmar", false);
        return huella("validacion", unidad).then(function (h) {
          return post("/api/validar-ok", {
            unidad: unidad,
            huella: h,
            presentacion: p.id,
            version: p.version,
            contenido_revisado: (p.pasos || []).join("\n"),
            eleccion: "confirmado",
            comentario: "",
            confirmado: true,
          });
        }).then(function (r2) {
          if (r2.ok) return terminado("OK dado · " + unidad + " queda validada", true);
          terminado(r2.datos.error || "no pude registrar el OK", false);
        });
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (SOLO_LECTURA) return quitarLosBotonesDeEscribir();
      if (IR.apartado === "flujos") barra("Aprobar planos", aprobarPlanos);
      if (IR.apartado === "presentaciones") barra("OK, funciona", darElOk);
    });
  })();
</script>
<!--{CUERPO}-->
<script src="/render.js"></script>
<!--{GUION}-->
</body>
</html>
